name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No dependencies. No npm install. The generator is plain Node.
      - name: Build static site
        env:
          # Custom domain: the site is served at the apex, so there is no
          # path prefix. Changing this back to /unclaimed would break every
          # absolute URL, the service worker scope and the manifest at once.
          SITE_BASE: ''
          SITE_ORIGIN: https://unclaimedgrant.com
        run: node src/build.mjs
      - name: Verify build
        run: node scripts/verify.mjs
      # A dead internal link is a bug the build can see, so the build fails on
      # one rather than waiting for a visitor to find it.
      - name: Check every internal link
        run: node scripts/check-links.mjs
      - name: Workspace logic tests
        run: node scripts/test-dashboard.mjs
      # The gated dataset must not change the free total. If it ever does we
      # are lying to every free user about how much they are owed.
      - name: Paywall data tests
        run: node scripts/test-gating.mjs
      # The operator door is one inverted boolean away from being open to the
      # internet, so the negative cases are asserted, not reviewed.
      # A whole advertised feature returned nothing for the entire individual
      # side, silently, because two datasets have two deadline shapes.
      - name: Deadline tests
        run: EMIT_FULL_DATASET=1 node scripts/test-deadlines.mjs
      - name: Admin and analytics tests
        run: node scripts/test-admin.mjs
      # A missing translation raises no error — it just reads as English to
      # someone who cannot read English. These two turn that into a failure.
      - name: Translation completeness
        run: node scripts/test-i18n.mjs
      - name: Translation coverage on built pages
        run: node scripts/check-i18n.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
