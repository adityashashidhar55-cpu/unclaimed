name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No dependencies. No npm install. The generator is plain Node.
      - name: Build static site
        env:
          # Custom domain: the site is served at the apex, so there is no
          # path prefix. Changing this back to /unclaimed would break every
          # absolute URL, the service worker scope and the manifest at once.
          SITE_BASE: ''
          SITE_ORIGIN: https://unclaimedgrant.com
        run: node src/build.mjs
      - name: Verify build
        run: node scripts/verify.mjs
      # A dead internal link is a bug the build can see, so the build fails on
      # one rather than waiting for a visitor to find it.
      - name: Check every internal link
        run: node scripts/check-links.mjs
      - name: Workspace logic tests
        run: node scripts/test-dashboard.mjs
      # The gated dataset must not change the free total. If it ever does we
      # are lying to every free user about how much they are owed.
      - name: Paywall data tests
        run: node scripts/test-gating.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
